<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slate — Production Management for Creative Teams</title>
    <meta name="description" content="Know what you're actually making. Track projects, pay crew, send invoices, and see your real profit. Built by a production company, for production companies." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Slate" />
    <meta property="og:title" content="Slate — Production Management for Creative Teams" />
    <meta property="og:description" content="Know what you're actually making. Track projects, pay crew, send invoices, and see your real profit." />
    <meta property="og:url" content="https://getslate.net" />
    <meta property="og:image" content="https://getslate.net/og.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Slate — Production Management for Creative Teams" />
    <meta name="twitter:description" content="Know what you're actually making. Track projects, pay crew, send invoices, and see your real profit." />
    <meta name="twitter:image" content="https://getslate.net/og.png" />

    <link rel="canonical" href="https://getslate.net" />

    <!-- Baseline JSON-LD — present in initial HTML for AI/SEO crawlers
         that don't execute JS. Per-page schema is injected by JsonLd.tsx. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Slate",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web, iOS",
      "description": "Production management for creative teams. Track projects, pay crew, send invoices, and see your real profit per project.",
      "url": "https://getslate.net",
      "offers": [
        { "@type": "Offer", "name": "Free", "price": "0", "priceCurrency": "USD", "description": "Up to 10 projects, full Basic features." },
        { "@type": "Offer", "name": "Basic", "price": "9.99", "priceCurrency": "USD", "description": "Unlimited projects, calendar, invoicing, reports." },
        { "@type": "Offer", "name": "Pro", "price": "19.99", "priceCurrency": "USD", "description": "Everything in Basic + AI receipt scanning, P&L, advanced reports." }
      ],
      "publisher": { "@type": "Organization", "name": "SDub Media LLC", "url": "https://getslate.net" }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
